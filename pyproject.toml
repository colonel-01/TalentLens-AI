[project]
name = "resume-parser"
version = "2.0.0"
description = "TalentLens-AI — Hybrid AI Resume-JD Matching System"
readme = "README.md"
authors = [
    { name = "colonel-01", email = "shashwatcodes24@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.6.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
